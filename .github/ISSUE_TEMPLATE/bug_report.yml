name: Bug Report
description: Create a report to help us improve CapForge
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please ensure you have checked existing issues first.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what went wrong...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Steps or minimal python snippet to reproduce the behavior.
      placeholder: |
        1. Initialize adapter: `adapter = StandardAgentAdapter(...)`
        2. Call `invoke_skill(...)` with ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant Log Output or Traceback
      description: Paste any terminal logs or Python tracebacks.
      render: shell
  - type: dropdown
    id: environment
    attributes:
      label: Operating System & Python Version
      options:
        - Linux (Ubuntu/Debian) - Python 3.11
        - Linux (Ubuntu/Debian) - Python 3.12
        - macOS - Python 3.11
        - macOS - Python 3.12
        - Windows 10/11 - Python 3.11
        - Docker Container
        - Other (specify in description)
    validations:
      required: true
