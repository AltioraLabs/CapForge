worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    gzip on;
    gzip_types application/json text/plain application/yaml;
    server_tokens off;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upstream — round-robin to 2 API workers
    upstream skillforge_api {
        least_conn;
        server skillforge:8000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # HTTP — redirect to HTTPS (comment out if no SSL)
    server {
        listen 80;
        server_name _;

        # Health check endpoint — bypass HTTPS redirect for load balancer probes
        location = /health {
            proxy_pass http://skillforge_api;
            proxy_set_header Host $host;
            access_log off;
        }
        location = /health/ready {
            proxy_pass http://skillforge_api;
            proxy_set_header Host $host;
            access_log off;
        }

        # Redirect all other traffic to HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL — replace with your cert paths
        # ssl_certificate     /etc/nginx/ssl/fullchain.pem;
        # ssl_certificate_key /etc/nginx/ssl/privkey.pem;
        # ssl_protocols       TLSv1.2 TLSv1.3;
        # ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
        # ssl_session_cache   shared:SSL:10m;
        # ssl_session_timeout 10m;

        client_max_body_size 10m;
        client_body_timeout 30s;
        client_header_timeout 30s;

        # Proxy settings
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # API routes
        location / {
            proxy_pass http://skillforge_api;
        }

        # Dashboard — longer timeout for SSE/WebSocket
        location /dashboard {
            proxy_pass http://skillforge_api;
            proxy_buffering off;
        }

        # MCP endpoint
        location /mcp/ {
            proxy_pass http://skillforge_api;
        }
    }
}
