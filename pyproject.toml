[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "capforge"
version = "1.2.0"
description = "Autonomous Capability Acquisition, Verification, and Evolution Runtime for AI Agents"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "CapForge Core Team" }
]
dependencies = [
    "pydantic>=2.5.0",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "jinja2>=3.1.3",
    "slowapi>=0.1.9",
    "redis>=5.0.0",
    "google-generativeai>=0.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.4.0",
]
formal = [
    "z3-solver>=4.12.0",
    "sympy>=1.12.0",
]
all = [
    "z3-solver>=4.12.0",
    "sympy>=1.12.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.4.0",
]

[project.scripts]
capforge = "capforge.cli:app"

[tool.setuptools.packages.find]
include = ["capforge*"]


[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --import-mode=importlib"
testpaths = [
    "tests"
]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
]
ignore = [
    "E501",   # line length
    "B008",   # function call in argument defaults (FastAPI Depends/Query/Body)
    "UP042",  # Class inherits from both str and enum.Enum (keep compatible)
]

[tool.ruff.lint.isort]
known-first-party = ["capforge", "benchmarks"]

[tool.ruff.lint.per-file-ignores]
"**/__init__.py" = ["F401", "RUF022"]
"capforge/verification/sandbox.py" = ["S102"]
"benchmarks/*" = ["E402"]
"tests/test_benchmarks.py" = ["E402"]
